apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The config volume is written by the proxy user, not root.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: proxy
        image: proxy:latest
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        env:
        - name: PROXY_MODE
          value: "reverse"
        - name: PROXY_TARGET
          value: "http://example-service:9000"
        - name: PROXY_DB_PATH
          value: "/var/lib/proxy/config.db"
        # This Deployment runs in reverse mode, where every request is
        # origin-form — so the default /healthz would shadow the backend's own
        # health endpoint and the probes would report the proxy alive while the
        # backend was down. Move it somewhere a backend will not claim.
        - name: PROXY_HEALTH_PATH
          value: "/_proxy/healthz"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # The health path answers before the auth gate, so probes keep working
        # when basic auth is enabled.
        livenessProbe:
          httpGet:
            path: /_proxy/healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /_proxy/healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /var/lib/proxy
      volumes:
      # emptyDir keeps the read-only root filesystem workable, but configuration
      # changed at runtime through the UI is lost when the pod is replaced.
      # Swap in a PersistentVolumeClaim to make those changes durable.
      - name: config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
spec:
  selector:
    app: proxy
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: https
    port: 443
    targetPort: https
