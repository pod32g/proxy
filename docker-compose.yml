# Brings up the proxy together with its monitoring. The proxy service is what
# prometheus.yml scrapes by hostname — without it the stack starts, Grafana
# shows nothing, and the scrape target never resolves.
services:
  proxy:
    build:
      context: .
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      PROXY_MODE: forward
      PROXY_LOG_LEVEL: INFO
      PROXY_STATS_ENABLED: "true"
      # Prometheus scrapes without credentials. Metrics are exposed on the same
      # port as the proxy, so this is only appropriate because the port is not
      # published to an untrusted network in this compose file.
      PROXY_METRICS_PUBLIC: "true"
      PROXY_DB_PATH: /var/lib/proxy/config.db
      # The destination panel needs both: -stats fills the top-N table, and
      # this exports it. Off outside this stack, because hostnames are
      # client-controlled and belong in a metrics store only deliberately.
      PROXY_DESTINATION_METRICS: "true"
    volumes:
      - proxydata:/var/lib/proxy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - proxy

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      # This stack is a local demonstration, not a deployment. Without this you
      # land on a login page with no credentials provisioned, which is a poor
      # first five minutes for something whose point is "look at the dashboard".
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      # Grafana used to start here with no datasource and no dashboards, so
      # every panel a reader might have expected simply did not exist.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  proxydata:
