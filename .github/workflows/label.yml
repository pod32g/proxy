# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler

name: Labeler
# pull_request_target runs with a read/write token against the base repository
# and is triggered by anyone who can open a pull request. This workflow is only
# safe because it never checks out the PR head and never runs code from it —
# do not add actions/checkout, a build step, or any script here. If this job
# ever needs the PR contents, split it into a pull_request workflow instead.
on: [pull_request_target]

jobs:
  label:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/labeler@v7
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler.yml
